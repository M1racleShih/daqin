name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and environment
      description: Include the commit or version and redact secrets from logs.
    validations:
      required: true
