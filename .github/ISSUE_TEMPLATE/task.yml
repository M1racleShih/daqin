name: Task
description: Propose a task with a clear scope and expected result
title: "[Task] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and user outcome
      description: Explain the problem and the observable result.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Explain what may change, what must stay unchanged and which interfaces are affected.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List evidence that would demonstrate completion.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and environment
      description: Link prerequisite work and describe reproducible checks.
  - type: markdown
    attributes:
      value: >-
        Creating an Issue does not start an agent or grant execution permissions.
        A maintainer must confirm the scope, allowed actions and any configured resource limits before a run.
